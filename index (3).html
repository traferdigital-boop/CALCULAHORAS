<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E5JC6BQJ17"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PayCalc - Calculadora de Honorários e Hora Técnica</title>
    <meta name="theme-color" content="#0a304b" />
    <meta name="description" content="Ferramenta gratuita para cálculo de honorários, hora técnica e gestão de tempo para freelancers e autônomos." />
    <meta name="keywords" content="calculadora honorários, valor hora técnica, freelancer, timer financeiro, cálculo autônomo" />

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3901126634352230" crossorigin="anonymous"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              app: {
                bg: '#0a304b',
                card: 'rgba(255, 255, 255, 0.06)',
                input: 'rgba(255, 255, 255, 0.08)',
                green: '#1DB954',
                greenLight: '#00cc66',
                blue: '#0c6ef1',
                orange: '#ff751f',
                red: '#ff3131',
              },
            },
            fontFamily: {
              inter: ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .history-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .history-scroll::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 3px;
      }
      .history-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }
    </style>

    <!-- React & Babel Standalone (Para rodar sem build) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "react/": "https://esm.sh/react@^19.2.1/"
  }
}
</script>
</head>
<body class="bg-[#0a304b] text-white min-h-screen flex flex-col items-center">
    
    <div id="root" class="w-full flex justify-center"></div>

    <script type="text/babel">
        // --- 1. UTILS (format.ts) ---
        const formatCurrency = (value) => {
            return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        const formatTimeParts = (ms) => {
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            const milliseconds = Math.floor((ms % 1000) / 10);

            return {
                formattedTime: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`,
                formattedMs: `,${String(milliseconds).padStart(2, '0')}`
            };
        };

        const generateReport = (timeStr, grossStr, netStr, rate, tax) => {
            return `📊 RELATÓRIO DE HONORÁRIOS

⏱ Tempo trabalhado: ${timeStr}
💰 Valor bruto: ${grossStr}
💸 Valor líquido: ${netStr}
💼 Valor/hora: R$ ${rate.toFixed(2)}
📉 Impostos: ${tax}%

Gerado em ${new Date().toLocaleString('pt-BR')}`;
        };

        // --- 2. HOOKS (useStopwatch.ts) ---
        const { useState, useEffect, useRef, useCallback } = React;

        const STORAGE_KEY = 'paycalc_state_v3';
        const HISTORY_KEY = 'paycalc_history_v3';
        const BEEP_AUDIO = "data:audio/wav;base64,UklGRl9vT1BXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU"; 

        const useStopwatch = () => {
            const [elapsedTime, setElapsedTime] = useState(0);
            const [isRunning, setIsRunning] = useState(false);
            const [hourlyRate, setHourlyRate] = useState(150);
            const [taxRate, setTaxRate] = useState(20);
            const [history, setHistory] = useState([]);

            const startTimeRef = useRef(null);
            const requestRef = useRef(null);
            const lastHourRef = useRef(-1);
            const audioRef = useRef(null);

            useEffect(() => {
                audioRef.current = new Audio(BEEP_AUDIO);
            }, []);

            useEffect(() => {
                const savedStateStr = localStorage.getItem(STORAGE_KEY);
                const savedHistoryStr = localStorage.getItem(HISTORY_KEY);

                if (savedHistoryStr) {
                    try { setHistory(JSON.parse(savedHistoryStr)); } catch (e) { console.error(e); }
                }

                if (savedStateStr) {
                    try {
                        const savedState = JSON.parse(savedStateStr);
                        setHourlyRate(savedState.hourlyRate ?? 150);
                        setTaxRate(savedState.taxRate ?? 20);
                        if (savedState.isRunning) {
                            setElapsedTime(savedState.elapsedTime || 0);
                            setIsRunning(false);
                        } else {
                            setElapsedTime(savedState.elapsedTime || 0);
                            setIsRunning(false);
                        }
                    } catch (e) { console.error(e); }
                }
            }, []);

            useEffect(() => {
                const stateToSave = { elapsedTime, isRunning, hourlyRate, taxRate };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
            }, [elapsedTime, isRunning, hourlyRate, taxRate]);

            useEffect(() => {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            }, [history]);

            const animate = useCallback(() => {
                if (startTimeRef.current !== null) {
                    setElapsedTime((prevTotal) => {
                        const currentNow = Date.now();
                        const diff = currentNow - (startTimeRef.current || currentNow);
                        startTimeRef.current = currentNow;
                        
                        const newTotal = prevTotal + diff;
                        const h = Math.floor(newTotal / 3600000);
                        if (h > lastHourRef.current && h > 0) {
                            lastHourRef.current = h;
                            audioRef.current?.play().catch(() => {});
                        }
                        return newTotal;
                    });
                    requestRef.current = requestAnimationFrame(animate);
                }
            }, []);

            useEffect(() => {
                if (isRunning) {
                    startTimeRef.current = Date.now();
                    requestRef.current = requestAnimationFrame(animate);
                } else {
                    if (requestRef.current) cancelAnimationFrame(requestRef.current);
                    startTimeRef.current = null;
                }
                return () => {
                    if (requestRef.current) cancelAnimationFrame(requestRef.current);
                };
            }, [isRunning, animate]);

            const toggleTimer = () => setIsRunning(!isRunning);

            const resetTimer = () => {
                if (elapsedTime > 5000) addToHistory();
                setIsRunning(false);
                setElapsedTime(0);
                lastHourRef.current = -1;
            };

            const addToHistory = () => {
                const gross = (elapsedTime / 3600000) * hourlyRate;
                const net = taxRate > 0 ? gross * (1 - taxRate / 100) : gross;
                const { formattedTime, formattedMs } = formatTimeParts(elapsedTime);
                const timeStr = formattedTime + formattedMs;

                const newItem = {
                    id: Date.now().toString(),
                    date: new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    duration: timeStr,
                    gross: gross.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }),
                    net: net.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
                };

                setHistory(prev => [newItem, ...prev].slice(0, 50));
            };

            return { elapsedTime, isRunning, hourlyRate, setHourlyRate, taxRate, setTaxRate, history, toggleTimer, resetTimer };
        };

        // --- 3. APP COMPONENT (App.tsx) ---
        const App = () => {
            const {
                elapsedTime,
                isRunning,
                hourlyRate,
                setHourlyRate,
                taxRate,
                setTaxRate,
                history,
                toggleTimer,
                resetTimer
            } = useStopwatch();

            const [copyFeedback, setCopyFeedback] = useState('📋 Copiar Relatório');
            const gross = (elapsedTime / 3600000) * hourlyRate;
            const net = taxRate > 0 ? gross * (1 - taxRate / 100) : gross;
            const { formattedTime, formattedMs } = formatTimeParts(elapsedTime);

            const handleCopy = () => {
                const fullTimeStr = formattedTime + formattedMs;
                const grossStr = formatCurrency(gross);
                const netStr = formatCurrency(net);
                const report = generateReport(fullTimeStr, grossStr, netStr, hourlyRate, taxRate);

                navigator.clipboard.writeText(report).then(() => {
                    setCopyFeedback('✅ Copiado!');
                    setTimeout(() => setCopyFeedback('📋 Copiar Relatório'), 2000);
                });
            };

            return (
                <div className="w-full flex flex-col items-center py-12 px-4 gap-16">
                    <main className="w-full max-w-[420px] bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 sm:p-10 text-center shadow-2xl flex flex-col gap-6 relative overflow-hidden">
                        <div>
                            <h1 className="text-[26px] font-extrabold mb-2 text-white tracking-tight">Calculadora de Honorários</h1>
                            <p className="text-[15px] text-[#bbbbbb] leading-relaxed">Acompanhe suas horas com precisão e gere relatórios instantâneos.</p>
                        </div>

                        <div>
                            <div className="text-base font-semibold text-[#cccccc] mb-1">Tempo Decorrido</div>
                            <div className="font-extrabold text-[#ffffff] tracking-tighter tabular-nums text-5xl sm:text-[58px] leading-tight my-2">
                                {formattedTime}<span className="text-4xl sm:text-[40px] opacity-70">{formattedMs}</span>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <div>
                                <div className="text-base font-semibold text-[#cccccc] mb-1">Valor Bruto a Receber</div>
                                <div className="text-4xl sm:text-[38px] font-extrabold text-app-green tracking-tight">{formatCurrency(gross)}</div>
                            </div>
                            <div>
                                <div className="text-base font-semibold text-[#cccccc] mb-1">Valor Líquido a Receber</div>
                                <div className="text-3xl sm:text-[32px] font-extrabold text-app-greenLight tracking-tight">{formatCurrency(net)}</div>
                            </div>
                        </div>

                        <div className="space-y-4 text-left">
                            <div>
                                <label htmlFor="hourlyRate" className="block text-[15px] font-semibold text-[#cccccc] mb-2">Valor por Hora (R$)</label>
                                <input id="hourlyRate" type="number" value={hourlyRate} onChange={(e) => setHourlyRate(Math.max(0, parseFloat(e.target.value) || 0))} step="0.01" min="0" className="w-full p-[18px] text-[19px] text-center bg-app-input border-2 border-[#2a5d84] rounded-2xl text-white focus:outline-none focus:border-app-blue transition-colors appearance-none" />
                            </div>
                            <div>
                                <label htmlFor="taxRate" className="block text-[15px] font-semibold text-[#cccccc] mb-2">Impostos e taxas (%) – opcional</label>
                                <input id="taxRate" type="number" value={taxRate} onChange={(e) => setTaxRate(Math.max(0, Math.min(100, parseFloat(e.target.value) || 0)))} step="0.01" min="0" max="100" className="w-full p-[18px] text-[19px] text-center bg-app-input border-2 border-[#2a5d84] rounded-2xl text-white focus:outline-none focus:border-app-blue transition-colors appearance-none" />
                            </div>
                        </div>

                        <div className="flex gap-4 mt-2">
                            <button onClick={toggleTimer} className={`flex-1 p-5 text-[19px] font-bold rounded-2xl transition-all active:translate-y-1 shadow-lg ${isRunning ? 'bg-app-orange text-white' : 'bg-app-blue text-white'}`}>{isRunning ? 'Pausar' : 'Iniciar'}</button>
                            <button onClick={resetTimer} className="flex-1 p-5 text-[19px] font-bold rounded-2xl transition-all active:translate-y-1 shadow-lg bg-app-red text-white">Resetar</button>
                        </div>

                        <button onClick={handleCopy} className="w-full p-4 text-[16px] font-bold rounded-2xl transition-all active:translate-y-1 shadow-lg bg-app-greenLight text-white mt-2 flex items-center justify-center gap-2 hover:brightness-110">{copyFeedback}</button>

                        {history.length > 0 && (
                            <div className="mt-4 text-left bg-black/20 rounded-xl p-4 max-h-[200px] overflow-y-auto history-scroll border border-white/5">
                                <div className="text-xs font-bold text-white/40 uppercase mb-2 tracking-wider">Histórico Recente</div>
                                <div className="space-y-0">
                                    {history.map((item) => (
                                        <div key={item.id} className="py-2 border-b border-white/10 last:border-0 text-[14px] opacity-90 text-white/90">
                                            <span className="font-semibold text-app-blue">{item.date}</span> • {item.duration} • <span className="text-app-greenLight">{item.gross}</span> ({item.net})
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    <article className="w-full max-w-2xl text-[#d1d5db] space-y-10 pb-12 leading-relaxed">
                        <header className="border-b border-white/10 pb-8">
                            <h2 className="text-3xl font-bold text-white mb-4">Guia Prático: Como Calcular seus Honorários</h2>
                            <p className="text-lg text-[#9ca3af]">Dominar a precificação do seu trabalho é o primeiro passo para o sucesso como freelancer ou profissional liberal. Esta ferramenta ajuda você a transformar tempo em dinheiro, mas entender a estratégia por trás dos números é essencial.</p>
                        </header>

                        <section className="space-y-4">
                            <h3 className="text-2xl font-semibold text-white">Por que cronometrar seu trabalho?</h3>
                            <p>Muitos profissionais subestimam o tempo gasto em tarefas "invisíveis" como reuniões, ajustes, pesquisa e comunicação. Ao usar um cronômetro financeiro em tempo real (Time Tracking), você obtém:</p>
                            <ul className="list-disc pl-6 space-y-2 text-[#e5e7eb]">
                                <li><strong className="text-app-blue">Precisão na cobrança:</strong> Evite "chutar" valores e cobrar menos do que trabalhou.</li>
                                <li><strong className="text-app-blue">Dados para negociação:</strong> Apresente relatórios detalhados aos clientes sobre onde as horas foram investidas.</li>
                                <li><strong className="text-app-blue">Aumento de produtividade:</strong> O simples ato de "dar play" cria um compromisso mental de foco na tarefa.</li>
                            </ul>
                        </section>

                        <section className="space-y-4">
                            <h3 className="text-2xl font-semibold text-white">Como definir o Valor da Hora Técnica?</h3>
                            <p>O campo <em>"Valor por Hora"</em> não deve ser um número aleatório. Para chegar a um valor justo, utilize a seguinte lógica:</p>
                            <div className="bg-white/5 p-6 rounded-xl border-l-4 border-app-green">
                                <p className="font-mono text-sm text-app-greenLight mb-2">FÓRMULA BÁSICA</p>
                                <p className="font-semibold text-white">(Custos Fixos Mensais + Salário Desejado + Margem de Lucro) ÷ Horas Produtivas Mensais</p>
                            </div>
                            <p>Lembre-se: Nem todas as horas do mês são "vendáveis". Considere apenas o tempo efetivamente dedicado a projetos de clientes.</p>
                        </section>

                        <section className="space-y-4">
                            <h3 className="text-2xl font-semibold text-white">Entendendo Valor Bruto vs. Líquido</h3>
                            <p>Um erro comum é gastar tudo o que entra. Nossa calculadora possui um campo de <strong>"Impostos e taxas"</strong> para ajudar você a visualizar a realidade.</p>
                            <p>Se você é MEI, Simples Nacional ou Autônomo, insira a porcentagem aproximada de impostos (ex: 6% a 15%) ou taxas de plataformas (como Upwork ou 99Freelas). O valor <span className="text-app-greenLight font-bold">Líquido</span> é o que realmente vai para o seu bolso.</p>
                        </section>

                        <section className="bg-black/20 p-8 rounded-2xl mt-8">
                            <h3 className="text-xl font-bold text-white mb-4">Perguntas Frequentes</h3>
                            <div className="space-y-6">
                                <div>
                                    <h4 className="font-semibold text-app-blue mb-1">Essa ferramenta salva meus dados?</h4>
                                    <p className="text-sm">Sim. Seus dados de tempo e histórico são salvos automaticamente no seu navegador. Você pode fechar a aba e voltar depois sem perder o progresso.</p>
                                </div>
                                <div>
                                    <h4 className="font-semibold text-app-blue mb-1">Posso usar no celular?</h4>
                                    <p className="text-sm">Sim. O PayCalc funciona como um aplicativo (PWA). Você pode instalá-lo na tela inicial do seu Android ou iOS.</p>
                                </div>
                            </div>
                        </section>
                    </article>

                    <footer className="w-full text-center border-t border-white/10 pt-8 pb-4 text-white/60 text-sm">
                        <p className="mb-2">PayCalc © {new Date().getFullYear()} - Todos os direitos reservados.</p>
                        <p>Desenvolvido por <a href="https://wa.me/5511988484500" target="_blank" rel="noopener noreferrer" className="text-[#ff9900] no-underline font-extrabold hover:text-[#ffad33] transition-colors">Trafer Digital</a></p>
                    </footer>
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
