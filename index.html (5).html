<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E5JC6BQJ17"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-E5JC6BQJ17');

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PayCalc - Calculadora de Honorários e Hora Técnica</title>
    <meta name="theme-color" content="#0a304b" />
    <meta name="description" content="Ferramenta gratuita para cálculo de honorários, hora técnica e gestão de tempo para freelancers e autônomos com suporte a múltiplas moedas." />
    <meta name="keywords" content="calculadora honorários, valor hora técnica, freelancer, timer financeiro, cálculo autônomo, câmbio moedas" />

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3901126634352230" crossorigin="anonymous"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              app: {
                bg: '#0a304b',
                card: 'rgba(255, 255, 255, 0.06)',
                input: 'rgba(255, 255, 255, 0.08)',
                green: '#1DB954',
                greenLight: '#00cc66',
                blue: '#0c6ef1',
                orange: '#ff751f',
                red: '#ff3131',
              },
            },
            fontFamily: {
              inter: ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-in-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          },
        },
      };
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .history-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .history-scroll::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 3px;
      }
      .history-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }
      select option {
        background-color: #0a304b;
        color: white;
      }
    </style>

    <!-- React & Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "react/": "https://esm.sh/react@^19.2.1/"
  }
}
</script>
</head>
<body class="bg-[#0a304b] text-white min-h-screen flex flex-col items-center">
    
    <div id="root" class="w-full flex justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- 1. UTILS ---
        const formatCurrency = (value, currencyCode = 'BRL') => {
            return value.toLocaleString('pt-BR', { style: 'currency', currency: currencyCode });
        };

        const formatTimeParts = (ms) => {
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            const milliseconds = Math.floor((ms % 1000) / 10);

            return {
                formattedTime: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`,
                formattedMs: `,${String(milliseconds).padStart(2, '0')}`
            };
        };

        const generateReport = (timeStr, grossStr, netStr, rate, tax, currency) => {
            return `📊 RELATÓRIO DE HONORÁRIOS (${currency})

⏱ Tempo trabalhado: ${timeStr}
💰 Valor bruto: ${grossStr}
💸 Valor líquido: ${netStr}
💼 Valor/hora: ${currency} ${rate.toFixed(2)}
📉 Impostos: ${tax}%

Gerado em ${new Date().toLocaleString('pt-BR')}`;
        };

        // --- 2. CONSTANTS ---
        const API_URL = 'https://api.exchangerate-api.com/v4/latest/BRL';
        const STORAGE_KEY = 'paycalc_state_v3';
        const HISTORY_KEY = 'paycalc_history_v3';
        const BEEP_AUDIO = "data:audio/wav;base64,UklGRl9vT1BXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU"; 
        const CURRENCIES = ['BRL', 'USD', 'EUR', 'GBP', 'CAD', 'ARS', 'JPY'];

        // --- 3. HOOKS ---
        const useStopwatch = () => {
            const [elapsedTime, setElapsedTime] = useState(0);
            const [isRunning, setIsRunning] = useState(false);
            const [hourlyRate, setHourlyRate] = useState(150);
            const [taxRate, setTaxRate] = useState(20);
            const [history, setHistory] = useState([]);
            const [targetCurrency, setTargetCurrency] = useState('BRL');
            const [rates, setRates] = useState({ BRL: 1 });
            const [loadingRates, setLoadingRates] = useState(false);

            const startTimeRef = useRef(null);
            const requestRef = useRef(null);
            const lastHourRef = useRef(-1);
            const audioRef = useRef(null);

            // Fetch Rates
            const fetchRates = useCallback(async () => {
                setLoadingRates(true);
                try {
                    const response = await fetch(API_URL);
                    const data = await response.json();
                    setRates(data.rates);
                } catch (e) {
                    console.error('Erro ao buscar taxas de câmbio', e);
                } finally {
                    setLoadingRates(false);
                }
            }, []);

            useEffect(() => {
                fetchRates();
                const interval = setInterval(fetchRates, 300000); // 5 min
                return () => clearInterval(interval);
            }, [fetchRates]);

            useEffect(() => {
                audioRef.current = new Audio(BEEP_AUDIO);
            }, []);

            useEffect(() => {
                const savedStateStr = localStorage.getItem(STORAGE_KEY);
                const savedHistoryStr = localStorage.getItem(HISTORY_KEY);

                if (savedHistoryStr) {
                    try { setHistory(JSON.parse(savedHistoryStr)); } catch (e) { console.error(e); }
                }

                if (savedStateStr) {
                    try {
                        const savedState = JSON.parse(savedStateStr);
                        setHourlyRate(savedState.hourlyRate ?? 150);
                        setTaxRate(savedState.taxRate ?? 20);
                        setTargetCurrency(savedState.targetCurrency ?? 'BRL');
                        setElapsedTime(savedState.elapsedTime || 0);
                    } catch (e) { console.error(e); }
                }
            }, []);

            useEffect(() => {
                const stateToSave = { elapsedTime, isRunning, hourlyRate, taxRate, targetCurrency };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
            }, [elapsedTime, isRunning, hourlyRate, taxRate, targetCurrency]);

            useEffect(() => {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            }, [history]);

            const animate = useCallback(() => {
                if (startTimeRef.current !== null) {
                    setElapsedTime((prevTotal) => {
                        const currentNow = Date.now();
                        const diff = currentNow - (startTimeRef.current || currentNow);
                        startTimeRef.current = currentNow;
                        
                        const newTotal = prevTotal + diff;
                        const h = Math.floor(newTotal / 3600000);
                        if (h > lastHourRef.current && h > 0) {
                            lastHourRef.current = h;
                            audioRef.current?.play().catch(() => {});
                        }
                        return newTotal;
                    });
                    requestRef.current = requestAnimationFrame(animate);
                }
            }, []);

            useEffect(() => {
                if (isRunning) {
                    startTimeRef.current = Date.now();
                    requestRef.current = requestAnimationFrame(animate);
                } else {
                    if (requestRef.current) cancelAnimationFrame(requestRef.current);
                    startTimeRef.current = null;
                }
                return () => {
                    if (requestRef.current) cancelAnimationFrame(requestRef.current);
                };
            }, [isRunning, animate]);

            const toggleTimer = () => setIsRunning(!isRunning);

            const resetTimer = () => {
                if (elapsedTime > 5000) addToHistory();
                setIsRunning(false);
                setElapsedTime(0);
                lastHourRef.current = -1;
            };

            const addToHistory = () => {
                const baseGross = (elapsedTime / 3600000) * hourlyRate;
                const baseNet = taxRate > 0 ? baseGross * (1 - taxRate / 100) : baseGross;
                
                const currentRate = rates[targetCurrency] || 1;
                const convertedGross = baseGross * currentRate;
                const convertedNet = baseNet * currentRate;

                const { formattedTime, formattedMs } = formatTimeParts(elapsedTime);
                const timeStr = formattedTime + formattedMs;

                const newItem = {
                    id: Date.now().toString(),
                    date: new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    duration: timeStr,
                    gross: formatCurrency(convertedGross, targetCurrency),
                    net: formatCurrency(convertedNet, targetCurrency),
                    currency: targetCurrency
                };

                setHistory(prev => [newItem, ...prev].slice(0, 50));
            };

            return { 
                elapsedTime, isRunning, hourlyRate, setHourlyRate, 
                taxRate, setTaxRate, history, toggleTimer, resetTimer,
                targetCurrency, setTargetCurrency, rates, loadingRates 
            };
        };

        // --- 4. MAIN APP COMPONENT ---
        const App = () => {
            const {
                elapsedTime,
                isRunning,
                hourlyRate,
                setHourlyRate,
                taxRate,
                setTaxRate,
                history,
                toggleTimer,
                resetTimer,
                targetCurrency,
                setTargetCurrency,
                rates,
                loadingRates
            } = useStopwatch();

            const [copyFeedback, setCopyFeedback] = useState('📋 Copiar Relatório');
            
            // Cálculos baseados em BRL transformados para a moeda alvo
            const baseGross = (elapsedTime / 3600000) * hourlyRate;
            const baseNet = taxRate > 0 ? baseGross * (1 - taxRate / 100) : baseGross;
            
            const currentExchangeRate = rates[targetCurrency] || 1;
            const gross = baseGross * currentExchangeRate;
            const net = baseNet * currentExchangeRate;

            const { formattedTime, formattedMs } = formatTimeParts(elapsedTime);

            const handleCopy = () => {
                const fullTimeStr = formattedTime + formattedMs;
                const grossStr = formatCurrency(gross, targetCurrency);
                const netStr = formatCurrency(net, targetCurrency);
                const report = generateReport(fullTimeStr, grossStr, netStr, hourlyRate * currentExchangeRate, taxRate, targetCurrency);

                navigator.clipboard.writeText(report).then(() => {
                    setCopyFeedback('✅ Copiado!');
                    setTimeout(() => setCopyFeedback('📋 Copiar Relatório'), 2000);
                });
            };

            return (
                <div className="w-full flex flex-col items-center py-12 px-4 gap-16">
                    <main className="w-full max-w-[420px] bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 sm:p-10 text-center shadow-2xl flex flex-col gap-6 relative overflow-hidden transition-all duration-300">
                        <div className="animate-fade-in">
                            <h1 className="text-[26px] font-extrabold mb-1 text-white tracking-tight">PayCalc</h1>
                            <p className="text-[14px] text-[#bbbbbb] leading-relaxed">Gestão de tempo e honorários com câmbio real.</p>
                        </div>

                        {/* Exibição do Tempo */}
                        <div className="bg-white/5 rounded-2xl py-4 border border-white/10">
                            <div className="text-xs font-bold text-[#cccccc] uppercase tracking-wider mb-1">Tempo Trabalhado</div>
                            <div className="font-extrabold text-[#ffffff] tracking-tighter tabular-nums text-5xl sm:text-[58px] leading-tight transition-all">
                                {formattedTime}<span className="text-4xl sm:text-[40px] opacity-50">{formattedMs}</span>
                            </div>
                        </div>

                        {/* Exibição Financeira (Valor Convertido) */}
                        <div className="bg-white/5 rounded-2xl p-6 border border-white/10 relative overflow-hidden group">
                           <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                              <span className="text-4xl">💰</span>
                           </div>
                           <div className="text-xs font-semibold text-[#cccccc] mb-1 uppercase tracking-wide text-left">Ganhos no Período</div>
                           <div className="text-4xl font-extrabold text-app-greenLight tracking-tight text-left break-words">
                              {formatCurrency(gross, targetCurrency)}
                           </div>
                           <div className="text-left mt-2 text-sm text-white/50 flex justify-between">
                             <span>Líquido: {formatCurrency(net, targetCurrency)}</span>
                             {loadingRates && <span className="animate-pulse text-[10px] uppercase">Atualizando câmbio...</span>}
                           </div>
                        </div>

                        <div className="space-y-4 text-left">
                            {/* Seletor de Moeda */}
                            <div>
                                <label className="block text-[13px] font-semibold text-[#cccccc] mb-2 pl-1 uppercase tracking-wider">Moeda de Visualização</label>
                                <select 
                                    value={targetCurrency} 
                                    onChange={(e) => setTargetCurrency(e.target.value)} 
                                    className="w-full p-4 bg-app-card border-2 border-[#2a5d84] rounded-2xl text-white font-bold focus:border-app-blue outline-none cursor-pointer transition-colors"
                                >
                                    {CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>

                            {/* Valor por Hora (Base BRL) */}
                            <div>
                                <label htmlFor="hourlyRate" className="block text-[13px] font-semibold text-[#cccccc] mb-2 pl-1 uppercase tracking-wider">Valor p/ Hora Base (BRL)</label>
                                <div className="relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-white/40 font-bold">R$</span>
                                    <input id="hourlyRate" type="number" value={hourlyRate} onChange={(e) => setHourlyRate(Math.max(0, parseFloat(e.target.value) || 0))} step="1" min="0" className="w-full p-4 pl-12 text-[20px] font-bold bg-app-input border-2 border-[#2a5d84] rounded-2xl text-white focus:outline-none focus:border-app-blue transition-colors appearance-none" />
                                </div>
                            </div>

                            {/* Impostos */}
                            <div>
                                <label htmlFor="taxRate" className="block text-[13px] font-semibold text-[#cccccc] mb-2 pl-1 uppercase tracking-wider">Descontos / Taxas (%)</label>
                                <div className="relative">
                                    <input id="taxRate" type="number" value={taxRate} onChange={(e) => setTaxRate(Math.max(0, Math.min(100, parseFloat(e.target.value) || 0)))} step="0.5" min="0" max="100" className="w-full p-4 text-[20px] font-bold text-center bg-app-input border-2 border-[#2a5d84] rounded-2xl text-white focus:outline-none focus:border-app-blue transition-colors appearance-none" />
                                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-white/40 font-bold">%</span>
                                </div>
                            </div>
                        </div>

                        {/* Controles do Timer */}
                        <div className="flex gap-4 mt-2">
                            <button onClick={toggleTimer} className={`flex-1 p-5 text-[18px] font-bold rounded-2xl transition-all active:scale-95 shadow-lg ${isRunning ? 'bg-app-orange text-white' : 'bg-app-blue text-white'}`}>
                                {isRunning ? 'Pausar' : 'Iniciar'}
                            </button>
                            <button onClick={resetTimer} className="flex-1 p-5 text-[18px] font-bold rounded-2xl transition-all active:scale-95 shadow-lg bg-app-red text-white">Resetar</button>
                        </div>

                        <button onClick={handleCopy} className="w-full p-4 text-[16px] font-bold rounded-2xl transition-all active:scale-95 shadow-lg bg-app-greenLight text-white flex items-center justify-center gap-2 hover:brightness-110">{copyFeedback}</button>

                        {/* Histórico com Moeda Original */}
                        {history.length > 0 && (
                            <div className="mt-4 text-left bg-black/30 rounded-2xl p-4 max-h-[180px] overflow-y-auto history-scroll border border-white/5 animate-fade-in">
                                <div className="text-[10px] font-bold text-white/40 uppercase mb-3 tracking-[0.2em]">Histórico de Sessões</div>
                                <div className="space-y-3">
                                    {history.map((item) => (
                                        <div key={item.id} className="pb-3 border-b border-white/5 last:border-0 text-[13px] leading-tight">
                                            <div className="flex justify-between items-start mb-1">
                                                <span className="font-bold text-app-blue">{item.date}</span>
                                                <span className="text-white/40 text-[10px]">{item.duration}</span>
                                            </div>
                                            <div className="flex justify-between text-white/80">
                                                <span>Total: <span className="text-app-greenLight font-bold">{item.gross}</span></span>
                                                <span className="text-[11px] opacity-60">({item.net})</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        
                        <div className="text-[10px] text-white/20 uppercase tracking-widest mt-2">
                           Taxas via ExchangeRate-API • BRL base
                        </div>
                    </main>

                    {/* Guia Educativo */}
                    <article className="w-full max-w-2xl text-[#d1d5db] space-y-10 pb-12 leading-relaxed">
                        <header className="border-b border-white/10 pb-8 text-center sm:text-left">
                            <h2 className="text-3xl font-bold text-white mb-4">Calculadora Multi-Moeda para Freelancers</h2>
                            <p className="text-lg text-[#9ca3af]">Especialmente útil para quem trabalha para o exterior ou viaja enquanto produz. Converta seu esforço em qualquer moeda global instantaneamente.</p>
                        </header>

                        <section className="space-y-4">
                            <h3 className="text-2xl font-semibold text-white">Por que usar o Câmbio em Tempo Real?</h3>
                            <p>Trabalhar com clientes internacionais exige precisão. Com o PayCalc, você define sua hora base em Reais (BRL) e vê quanto está faturando em Dólar (USD) ou Euro (EUR) no exato momento, facilitando a negociação de <em>Invoices</em>.</p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">
                                <div className="p-5 bg-white/5 rounded-2xl border border-white/5">
                                    <h4 className="font-bold text-app-blue mb-2">Visão Estratégica</h4>
                                    <p className="text-sm">Acompanhe a variação cambial durante sua jornada de trabalho e saiba o melhor momento para cobrar.</p>
                                </div>
                                <div className="p-5 bg-white/5 rounded-2xl border border-white/5">
                                    <h4 className="font-bold text-app-greenLight mb-2">Relatórios Globais</h4>
                                    <p className="text-sm">Envie relatórios já convertidos para a moeda do seu cliente internacional.</p>
                                </div>
                            </div>
                        </section>

                        <section className="space-y-4">
                            <h3 className="text-2xl font-semibold text-white">Dicas de Precificação</h3>
                            <p>Seu valor por hora deve considerar não apenas o salário, mas também custos de hardware, software e previdência. Use a calculadora para testar diferentes cenários:</p>
                            <ul className="list-disc pl-6 space-y-3">
                                <li><strong>Margem de Segurança:</strong> Se o câmbio estiver volátil, aumente seu valor hora base.</li>
                                <li><strong>Diferenciação:</strong> Clientes estrangeiros costumam pagar valores maiores por hora em moedas fortes.</li>
                                <li><strong>Custos Bancários:</strong> Use o campo de <em>Taxas</em> para simular o IOF e spreads de plataformas de remessa.</li>
                            </ul>
                        </section>

                        <footer className="w-full text-center border-t border-white/10 pt-8 pb-4 text-white/60 text-sm flex flex-col items-center gap-2">
                            <p>PayCalc © {new Date().getFullYear()} - Todos os direitos reservados.</p>
                            <p>Desenvolvido por <a href="https://wa.me/5511988484500" target="_blank" rel="noopener noreferrer" className="text-app-orange no-underline font-extrabold hover:underline">Trafer Digital</a></p>
                        </footer>
                    </article>
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
